server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/manifest+json image/png;

    # The shell and the worker must always be revalidated, otherwise a browser
    # can pin itself to an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # .webmanifest is missing from nginx's bundled mime.types. A `types` block
    # here would replace that map wholesale, so set the type on the file itself.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(png|txt)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
